<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hill Climb Adventure</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101722;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
button{font:700 16px system-ui;cursor:pointer;border:0}
#menu,#gameOver{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:linear-gradient(#17243acc,#071018e8)}
.panel{width:min(92vw,430px);padding:26px;border-radius:24px;text-align:center;color:white;background:#182433ee;box-shadow:0 20px 60px #0008}
h1{margin:0 0 8px;font-size:36px}.sub{opacity:.75;margin-bottom:22px}
.primary{padding:14px 28px;border-radius:14px;background:#ffd447;color:#1b1b1b;font-size:19px}
.vehicle-row{display:flex;gap:10px;justify-content:center;margin:18px 0}
.vehicle{padding:12px 16px;border-radius:12px;background:#26364a;color:white}
.vehicle.active{outline:3px solid #ffd447}
#hud{position:fixed;top:max(10px,env(safe-area-inset-top));left:0;right:0;z-index:5;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 14px;color:#fff;pointer-events:none;text-shadow:0 2px 4px #000}
.hudBox{background:#0b1320aa;border-radius:12px;padding:8px 11px;min-width:105px}
.bar{height:9px;margin-top:5px;border-radius:10px;background:#333;overflow:hidden}.fill{height:100%;width:100%;background:#58d46b}
#fuelFill{background:#ffd447}
#mute{position:fixed;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:10;width:46px;height:46px;border-radius:50%;background:#0b1320cc;color:white}
.controls{position:fixed;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom));z-index:8;display:flex;justify-content:space-between;padding:0 20px;pointer-events:none}
.control{pointer-events:auto;width:clamp(105px,27vw,150px);height:clamp(80px,18vw,105px);border-radius:28px;color:white;font-size:20px;font-weight:900;box-shadow:inset 0 -7px #0003,0 8px 20px #0005;touch-action:none}
#brake{background:#d94c4c}#gas{background:#39a95b}
#gameOver{display:none}
.small{opacity:.7;font-size:13px;margin-top:12px}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="canvas"></canvas>

<div id="hud" class="hidden">
  <div class="hudBox">DISTANCE<br><b id="distance">0 m</b></div>
  <div class="hudBox">FUEL<div class="bar"><div id="fuelFill" class="fill"></div></div></div>
  <div class="hudBox">COINS<br><b id="coins">0</b></div>
</div>

<div class="controls hidden" id="controls">
  <button class="control" id="brake">◀ BRAKE</button>
  <button class="control" id="gas">GAS ▶</button>
</div>
<button id="mute" class="hidden" aria-label="Mute">🔊</button>

<section id="menu">
  <div class="panel">
    <h1>Hill Climb Adventure</h1>
    <div class="sub">Climb farther, collect coins, and keep your fuel tank alive.</div>
    <div>Best: <b id="best">0 m</b></div>
    <div class="vehicle-row">
      <button class="vehicle active" data-v="0">🚙 Scout</button>
      <button class="vehicle" data-v="1">🏎️ Speedster</button>
      <button class="vehicle" data-v="2">🚚 Heavy</button>
    </div>
    <button class="primary" id="play">PLAY</button>
    <div class="small">Desktop: A/D or ←/→ · Mobile: use the buttons</div>
  </div>
</section>

<section id="gameOver">
  <div class="panel">
    <h1>Run Over!</h1>
    <div class="sub" id="reason">Your adventure ended.</div>
    <h2 id="finalDistance">0 m</h2>
    <p>Best: <b id="overBest">0 m</b></p>
    <button class="primary" id="restart">TRY AGAIN</button>
  </div>
</section>

<script>
"use strict";

// ===== Canvas / responsive setup =====
const canvas=document.getElementById("canvas"),ctx=canvas.getContext("2d");
let W=innerWidth,H=innerHeight,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+"px";canvas.style.height=H+"px";ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener("resize",resize);resize();

// ===== Persistent progress =====
const savedBest=()=>+localStorage.getItem("hca_best")||0;
let best=savedBest(),selectedVehicle=+localStorage.getItem("hca_vehicle")||0;
document.getElementById("best").textContent=best+" m";

// ===== Vehicles =====
const vehicles=[
 {name:"Scout",mass:1,acc:.00034,max:4.2,grip:.12,color:"#e74c3c",fuel:100},
 {name:"Speedster",mass:.85,acc:.00043,max:5.0,grip:.10,color:"#42a5f5",fuel:90},
 {name:"Heavy",mass:1.35,acc:.00027,max:3.8,grip:.15,color:"#f6b93b",fuel:125}
];

// ===== Terrain =====
// Deterministic rolling terrain lets the world be effectively endless.
const terrainSeed=987654;
function terrainY(x){
  const base=H*.70;
  return base
    - Math.sin(x*.0021)*72
    - Math.sin(x*.0057+1.7)*30
    - Math.sin(x*.012+2.1)*13
    - Math.sin(x*.00055)*95
    - Math.sin(x*.025)*4;
}
function terrainType(x){
  const n=Math.floor(x/1800)%4;
  return ["grass","rock","snow","desert"][(n+4)%4];
}
function terrainColors(type){
  return {
    grass:["#5fbd57","#2e7d32"],
    rock:["#9299a1","#555b62"],
    snow:["#eaf6ff","#9bc6df"],
    desert:["#dba65a","#a56b36"]
  }[type];
}

// ===== Game state =====
let running=false,last=0,worldX=0,cameraX=0,fuel=100,coinCount=0,particles=[];
let flipTimer=0,grounded=false,prevGrounded=false;
const keys={gas:false,brake:false};
const car={x:180,y:terrainY(180)-50,vx:0,vy:0,angle:0,av:0,wheel:0};

// Collectibles are generated from their x position.
function coinAt(x){return Math.abs(Math.sin(x*.017+2))>.997}
function fuelAt(x){return Math.abs(Math.sin(x*.009+5))>.996}
let collected=new Set();

// ===== Audio =====
let audioCtx=null,muted=false,engineOsc=null;
function audioStart(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==="suspended")audioCtx.resume();
  if(!engineOsc){
    engineOsc=audioCtx.createOscillator();const gain=audioCtx.createGain();
    engineOsc.type="sawtooth";engineOsc.frequency.value=70;gain.gain.value=.018;
    engineOsc.connect(gain).connect(audioCtx.destination);engineOsc.start();
  }
}
function beep(freq=500,dur=.08){
  if(muted||!audioCtx)return;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.frequency.value=freq;o.type="square";g.gain.setValueAtTime(.045,audioCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+dur);
  o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+dur);
}
function updateAudio(){
  if(engineOsc)engineOsc.frequency.value=55+Math.abs(car.vx)*35+(keys.gas?45:0);
}

// ===== Particles =====
function burst(x,y,n=12){
 for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*3,vy:-Math.random()*3-1,life:.5+Math.random()*.5,r:2+Math.random()*3});
}
function updateParticles(dt){
 particles.forEach(p=>{p.x+=p.vx*60*dt;p.y+=p.vy*60*dt;p.vy+=7*dt;p.life-=dt});
 particles=particles.filter(p=>p.life>0);
}

// ===== Input =====
addEventListener("keydown",e=>{
 if(["ArrowRight","ArrowLeft","KeyD","KeyA","Space"].includes(e.code))e.preventDefault();
 if(e.code==="ArrowRight"||e.code==="KeyD")keys.gas=true;
 if(e.code==="ArrowLeft"||e.code==="KeyA")keys.brake=true;
});
addEventListener("keyup",e=>{
 if(e.code==="ArrowRight"||e.code==="KeyD")keys.gas=false;
 if(e.code==="ArrowLeft"||e.code==="KeyA")keys.brake=false;
});
function bindHold(el,key){
 const on=ev=>{ev.preventDefault();keys[key]=true;audioStart()};
 const off=ev=>{ev.preventDefault();keys[key]=false};
 el.addEventListener("pointerdown",on);["pointerup","pointercancel","pointerleave"].forEach(x=>el.addEventListener(x,off));
}
bindHold(document.getElementById("gas"),"gas");
bindHold(document.getElementById("brake"),"brake");

// ===== UI =====
const menu=document.getElementById("menu"),over=document.getElementById("gameOver"),hud=document.getElementById("hud"),controls=document.getElementById("controls"),muteBtn=document.getElementById("mute");
document.querySelectorAll(".vehicle").forEach(b=>b.onclick=()=>{
 document.querySelectorAll(".vehicle").forEach(x=>x.classList.remove("active"));
 b.classList.add("active");selectedVehicle=+b.dataset.v;localStorage.setItem("hca_vehicle",selectedVehicle);
});
function showGameUI(on){
 [hud,controls,muteBtn].forEach(x=>x.classList.toggle("hidden",!on));
}
function startGame(){
 audioStart();running=true;menu.style.display="none";over.style.display="none";showGameUI(true);
 worldX=0;cameraX=0;fuel=vehicles[selectedVehicle].fuel;coinCount=0;collected=new Set();particles=[];
 car.x=180;car.y=terrainY(car.x)-55;car.vx=0;car.vy=0;car.angle=0;car.av=0;flipTimer=0;
 last=performance.now();requestAnimationFrame(loop);
}
function endGame(reason){
 if(!running)return;running=false;beep(100,.3);
 const dist=Math.max(0,Math.floor((car.x-180)/10));
 if(dist>best){best=dist;localStorage.setItem("hca_best",best)}
 document.getElementById("finalDistance").textContent=dist+" m";
 document.getElementById("overBest").textContent=best+" m";
 document.getElementById("reason").textContent=reason;
 showGameUI(false);over.style.display="flex";
}
document.getElementById("play").onclick=startGame;
document.getElementById("restart").onclick=startGame;
muteBtn.onclick=()=>{muted=!muted;muteBtn.textContent=muted?"🔇":"🔊";};

// ===== Physics =====
function update(dt){
 const v=vehicles[selectedVehicle];
 const throttle=keys.gas?1:0, brake=keys.brake?1:0;
 const slope=(terrainY(car.x+20)-terrainY(car.x-20))/40;
 const gravity=0.0065;
 car.vy+=gravity*dt*60;
 car.vx-=slope*.004*dt*60;
 if(throttle)car.vx+=v.acc*dt*60;
 if(brake)car.vx-=v.acc*1.15*dt*60;
 car.vx*=Math.pow(.992,dt*60);
 car.vx=Math.max(-2.2,Math.min(v.max,car.vx));
 car.x+=car.vx*dt*60;
 car.y+=car.vy*dt*60;

 // Approximate two-wheel suspension using terrain heights.
 const wheelBase=54, wheelR=13;
 const rearX=car.x-wheelBase/2, frontX=car.x+wheelBase/2;
 const rearY=terrainY(rearX)-wheelR, frontY=terrainY(frontX)-wheelR;
 const desiredY=(rearY+frontY)/2-20;
 const groundError=car.y-desiredY;
 prevGrounded=grounded;grounded=groundError>=0;
 if(groundError>0){
   car.y-=groundError*.72;
   car.vy*=.15;
   const targetAngle=Math.atan2(frontY-rearY,wheelBase);
   let da=targetAngle-car.angle;
   while(da>Math.PI)da-=Math.PI*2;while(da<-Math.PI)da+=Math.PI*2;
   car.av+=da*.12;
   car.av*=.72;
   car.angle+=car.av;
   if(!prevGrounded){burst(car.x,car.y+25,7);beep(180,.05)}
 }else{
   car.angle+=car.av;
   car.av+=slope*.002*dt*60;
   car.av*=.995;
 }
 car.wheel+=car.vx*dt*60*.12;
 fuel-= (0.0025+Math.max(0,car.vx)*.0009)*(keys.gas?1.5:.55)*dt*60;
 if(fuel<=0){fuel=0;endGame("Out of fuel!");return}

 // Flip detection.
 const upside=Math.abs(Math.cos(car.angle))<.18;
 if(upside)flipTimer+=dt;else flipTimer=Math.max(0,flipTimer-dt*2);
 if(flipTimer>1.25){endGame("The vehicle flipped!");return}

 // Collectibles in nearby world cells.
 const cell=Math.floor(car.x/45);
 if(!collected.has("c"+cell) && coinAt(cell*45+22)){
   const cx=cell*45+22,cy=terrainY(cx)-55;
   if(Math.abs(car.x-cx)<25 && Math.abs(car.y-cy)<55){
     collected.add("c"+cell);coinCount++;burst(cx,cy,10);beep(900,.07);
   }
 }
 const fcell=Math.floor(car.x/90);
 if(!collected.has("f"+fcell) && fuelAt(fcell*90+45)){
   const fx=fcell*90+45,fy=terrainY(fx)-52;
   if(Math.abs(car.x-fx)<25 && Math.abs(car.y-fy)<60){
     collected.add("f"+fcell);fuel=Math.min(v.fuel,fuel+28);burst(fx,fy,12);beep(650,.1);
   }
 }
 updateParticles(dt);updateAudio();
 worldX=car.x;
 cameraX+=(car.x-W*.32-cameraX)*Math.min(1,dt*5);
 document.getElementById("distance").textContent=Math.max(0,Math.floor((car.x-180)/10))+" m";
 document.getElementById("coins").textContent=coinCount;
 document.getElementById("fuelFill").style.width=(fuel/v.fuel*100)+"%";
}

// ===== Rendering =====
function drawSky(){
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#65c9f2");g.addColorStop(1,"#d9f5ff");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // Sun
 ctx.fillStyle="#fff1a3";ctx.beginPath();ctx.arc(W*.78,H*.18,38,0,Math.PI*2);ctx.fill();
 // Distant mountains
 ctx.fillStyle="#7198a7aa";ctx.beginPath();ctx.moveTo(0,H*.58);
 for(let x=0;x<=W;x+=35)ctx.lineTo(x,H*.58-55-Math.sin((x+cameraX*.18)*.006)*35);
 ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
}
function drawTerrain(){
 const start=cameraX-100,end=cameraX+W+100,type=terrainType(cameraX),colors=terrainColors(type);
 ctx.beginPath();ctx.moveTo(0,H);
 for(let sx=-100;sx<=W+100;sx+=8){const wx=cameraX+sx;ctx.lineTo(sx,terrainY(wx))}
 ctx.lineTo(W+100,H);ctx.closePath();ctx.fillStyle=colors[1];ctx.fill();
 ctx.beginPath();for(let sx=-100;sx<=W+100;sx+=8){const wx=cameraX+sx;if(sx===-100)ctx.moveTo(sx,terrainY(wx));else ctx.lineTo(sx,terrainY(wx))}
 ctx.lineWidth=type==="snow"?5:4;ctx.strokeStyle=colors[0];ctx.stroke();
}
function drawCollectibles(){
 const a=Math.floor((cameraX-100)/45),b=Math.ceil((cameraX+W+100)/45);
 for(let i=a;i<=b;i++){
   const x=i*45+22;
   if(coinAt(x)&&!collected.has("c"+i)){
     const sx=x-cameraX,sy=terrainY(x)-52;
     ctx.fillStyle="#ffd447";ctx.beginPath();ctx.arc(sx,sy,9,0,Math.PI*2);ctx.fill();
     ctx.strokeStyle="#fff3a0";ctx.lineWidth=2;ctx.stroke();
   }
 }
 const fa=Math.floor((cameraX-100)/90),fb=Math.ceil((cameraX+W+100)/90);
 for(let i=fa;i<=fb;i++){
   const x=i*90+45;
   if(fuelAt(x)&&!collected.has("f"+i)){
     const sx=x-cameraX,sy=terrainY(x)-48;
     ctx.fillStyle="#ed4d4d";ctx.fillRect(sx-8,sy-13,16,26);
     ctx.fillStyle="#fff";ctx.fillRect(sx-3,sy-9,6,18);
   }
 }
}
function drawCar(){
 const v=vehicles[selectedVehicle],sx=car.x-cameraX,sy=car.y;
 ctx.save();ctx.translate(sx,sy);ctx.rotate(car.angle);
 // shadow/body
 ctx.fillStyle=v.color;roundRect(-38,-25,76,27,8);ctx.fill();
 // cabin
 ctx.fillStyle="#263746";ctx.beginPath();ctx.moveTo(-17,-25);ctx.lineTo(-6,-43);ctx.lineTo(18,-43);ctx.lineTo(30,-25);ctx.closePath();ctx.fill();
 ctx.fillStyle="#9de3f7";ctx.beginPath();ctx.moveTo(0,-39);ctx.lineTo(16,-39);ctx.lineTo(22,-27);ctx.lineTo(-5,-27);ctx.closePath();ctx.fill();
 // bumpers
 ctx.fillStyle="#222";ctx.fillRect(-43,-7,8,7);ctx.fillRect(35,-7,8,7);
 // wheels
 for(const wx of [-27,27]){
   ctx.save();ctx.translate(wx,0);ctx.rotate(car.wheel);
   ctx.fillStyle="#1d2227";ctx.beginPath();ctx.arc(0,7,14,0,Math.PI*2);ctx.fill();
   ctx.fillStyle="#aeb7bd";ctx.beginPath();ctx.arc(0,7,6,0,Math.PI*2);ctx.fill();
   ctx.restore();
 }
 ctx.restore();
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function drawParticles(){
 particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(p.x-cameraX,p.y,p.r,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
}
function render(){drawSky();drawTerrain();drawCollectibles();drawCar();drawParticles()}
function loop(t){
 if(!running)return;
 const dt=Math.min(.032,(t-last)/1000||.016);last=t;
 update(dt);render();requestAnimationFrame(loop);
}

// Initial menu background.
render();
</script>
</body>
</html>
